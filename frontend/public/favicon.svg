<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FileInNOut">
  <defs>
    <linearGradient id="fn-tile-grad" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F7FF" />
    </linearGradient>
    <linearGradient id="fn-arrow-grad" x1="8" y1="8" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8CE6FF" />
      <stop offset="50%" stop-color="#24BEFF" />
      <stop offset="100%" stop-color="#0086D8" />
    </linearGradient>
    <linearGradient id="fn-plaque-grad" x1="8" y1="28" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="58%" stop-color="#1B44B8" />
      <stop offset="100%" stop-color="#112872" />
    </linearGradient>
    <path
      id="fn-arrow-shape"
      d="M19.6 56.2 L8.2 10.6 Q7.7 8.4 9.9 9.0 L45.0 18.2 L46.6 11.8 L58.2 24.4 L41.4 29.8 L43.0 23.4 L17.6 16.8 L28.2 56.2 Z"
    />
    <path
      id="fn-folder-shape"
      d="M8.5 32.0 L8.5 29.5 Q8.5 27.6 10.4 27.6 L21.6 27.6 Q23.0 27.6 23.9 28.8 L26.0 32.0 L52.0 32.0 Q54.2 32.0 54.2 34.2 L54.2 48.2 Q54.2 50.4 52.0 50.4 L10.7 50.4 Q8.5 50.4 8.5 48.2 Z"
    />
    <clipPath id="fn-arrow-clip">
      <use href="#fn-arrow-shape" />
    </clipPath>
    <clipPath id="fn-folder-clip">
      <use href="#fn-folder-shape" />
    </clipPath>
  </defs>

  <!-- Rounded cool-white icon tile -->
  <rect x="1.2" y="1.2" width="61.6" height="61.6" rx="13.5" fill="url(#fn-tile-grad)" stroke="#C6D9F1" stroke-width="1.4" />

  <!-- Unified 3D extrusion base shared by both arrow and folder plaque -->
  <use
    href="#fn-arrow-shape"
    transform="translate(1.5, 1.8)"
    fill="#025C9C"
    stroke="#025C9C"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
  <use
    href="#fn-folder-shape"
    transform="translate(1.5, 1.8)"
    fill="#091848"
    stroke="#091848"
    stroke-width="1.0"
    stroke-linejoin="round"
  />

  <!-- Main luminous sky-cyan bent arrow -->
  <use
    href="#fn-arrow-shape"
    fill="url(#fn-arrow-grad)"
    stroke="#0272BC"
    stroke-width="0.9"
    stroke-linejoin="round"
  />

  <!-- Top bevel highlight along upper edge of arrow -->
  <path
    d="M10.2 10.4 L44.8 19.5 L46.4 13.4"
    fill="none"
    stroke="#E6F9FF"
    stroke-width="1.3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Contact shadow cast by the folder directly onto the arrow stem (zero cutout gap) -->
  <g clip-path="url(#fn-arrow-clip)">
    <use
      href="#fn-folder-shape"
      transform="translate(0, 1.6)"
      fill="#072152"
      fill-opacity="0.38"
    />
  </g>

  <!-- Main deep royal-blue folder-plaque flush over the bent arrow -->
  <use
    href="#fn-folder-shape"
    fill="url(#fn-plaque-grad)"
    stroke="#0D2263"
    stroke-width="0.9"
    stroke-linejoin="round"
  />

  <!-- Subtle top inner bevel highlight matching the arrow lighting -->
  <g clip-path="url(#fn-folder-clip)">
    <path
      d="M9.5 28.4 H22.0 Q22.8 28.4 23.4 29.3 L25.5 32.6 H53.2"
      fill="none"
      stroke="#93C5FD"
      stroke-opacity="0.60"
      stroke-width="1.1"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Single bold geometric 'F' emblem -->
  <path
    d="M25.4 34.8 H38.2 V38.0 H29.3 V40.3 H36.5 V43.4 H29.3 V48.0 H25.4 Z"
    fill="#FFFFFF"
  />
</svg>
