name: fileinnout-lan-app

services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/two-vm/docker/backend.Dockerfile
    image: fileinnout/backend:${APP_VERSION:-lan-prod}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${LAN_HOST_IP:-192.168.35.30}:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "false"
      HIBERNATE_FORMAT_SQL: ${HIBERNATE_FORMAT_SQL:-false}
      LOG_LEVEL_SECURITY_FILTER: ${LOG_LEVEL_SECURITY_FILTER:-INFO}
      LOG_LEVEL_DISPATCHER: ${LOG_LEVEL_DISPATCHER:-INFO}
      LOG_LEVEL_SQL: ${LOG_LEVEL_SQL:-WARN}
      LOG_LEVEL_SQL_BIND: ${LOG_LEVEL_SQL_BIND:-WARN}
      DB_SERVER: org.mariadb.jdbc.Driver
      DB_URL: jdbc:mariadb://${DB_HOST:?DB_HOST must be set}:${DB_PORT:-3306}/${DB_NAME:?DB_NAME must be set}?connectTimeout=5000&socketTimeout=30000&tcpKeepAlive=true&useServerPrepStmts=true&cachePrepStmts=true
      DB_ID: ${DB_ID:?DB_ID must be set}
      DB_PASS: ${DB_PASS:?DB_PASS must be set}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-5}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-10000}
      DB_VALIDATION_TIMEOUT_MS: ${DB_VALIDATION_TIMEOUT_MS:-2500}
      DB_KEEPALIVE_TIME_MS: ${DB_KEEPALIVE_TIME_MS:-120000}
      DB_MAX_LIFETIME_MS: ${DB_MAX_LIFETIME_MS:-540000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-300000}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-fileinnout-opt}
      APP_REALTIME_REDIS_LISTENER_ENABLED: ${APP_REALTIME_REDIS_LISTENER_ENABLED:-false}
      REDIS_SENTINEL_MASTER: ${REDIS_SENTINEL_MASTER:-}
      REDIS_SENTINEL_NODES: ${REDIS_SENTINEL_NODES:-}
      JWT_KEY: ${JWT_KEY:?JWT_KEY must be set}
      JWT_EXPIRE: ${JWT_EXPIRE:-86400000}
      PROJECT_AES_KEY: ${PROJECT_AES_KEY:?PROJECT_AES_KEY must be set}
      PORTONE_SECRET: ${PORTONE_SECRET:-disabled}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fileinnout.local}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_ROLE: ROLE_ADMIN
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      ADMIN_ADDITIONAL_USERS: ${ADMIN_ADDITIONAL_USERS:-}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://192.168.35.30}
      APP_BACKEND_URL: ${APP_BACKEND_URL:-http://192.168.35.30/api}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://192.168.35.30}
      APP_CORS_ALLOW_DEVELOPMENT_ORIGIN_PATTERNS: "false"
      APP_SECURE_COOKIE: "false"
      APP_COOKIE_SAME_SITE: Lax
      APP_ADMIN_ONLY: ${APP_ADMIN_ONLY:-false}
      APP_DEMO_ACCOUNT_ENABLED: ${APP_DEMO_ACCOUNT_ENABLED:-false}
      APP_DOCS_PUBLIC_OPENAPI: "false"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-disabled}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-disabled}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-disabled}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-disabled}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-disabled}
      CLIENT_ID: ${KAKAO_CLIENT_ID:-disabled}
      CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-disabled}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_ID: ${MAIL_ID:-}
      MAIL_PASS: ${MAIL_PASS:-}
      STORAGE_PROVIDER: minio
      MINIO_API: ${MINIO_API:?MINIO_API must be set}
      MINIO_PUBLIC_API: ${MINIO_PUBLIC_API:?MINIO_PUBLIC_API must be set}
      MINIO_NAME: ${MINIO_NAME:?MINIO_NAME must be set}
      MINIO_SECRET: ${MINIO_SECRET:?MINIO_SECRET must be set}
      MINIO_CLOUD_BUCKET: ${MINIO_CLOUD_BUCKET:?MINIO_CLOUD_BUCKET must be set}
      MINIO_WORKSPACE_BUCKET: ${MINIO_WORKSPACE_BUCKET:?MINIO_WORKSPACE_BUCKET must be set}
      MINIO_REGION: ${MINIO_REGION:-ap-northeast-2}
      S3AMAZON_API: https://s3.ap-northeast-2.amazonaws.com
      S3AMAZON_PUBLIC_API: https://s3.ap-northeast-2.amazonaws.com
      S3AMAZON_NAME: ""
      S3AMAZON_SECRET: ""
      S3AMAZON_CLOUD_BUCKET: ""
      S3AMAZON_WORKSPACE_BUCKET: ""
      S3AMAZON_REGION: ap-northeast-2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 90s

  websocket:
    build:
      context: ../..
      dockerfile: deploy/two-vm/docker/websocket.Dockerfile
    image: fileinnout/websocket:${APP_VERSION:-lan-prod}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: "1234"
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-fileinnout-opt}
      APP_REALTIME_REDIS_LISTENER_ENABLED: ${APP_REALTIME_REDIS_LISTENER_ENABLED:-false}
      REDIS_SENTINEL_MASTER: ${REDIS_SENTINEL_MASTER:-}
      REDIS_SENTINEL_NODES: ${REDIS_SENTINEL_NODES:-}
      YJS_REDIS_PREFIX: ${YJS_REDIS_PREFIX:-fileinnout-opt:yjs}
      YJS_REDIS_PUBSUB_ENABLED: ${YJS_REDIS_PUBSUB_ENABLED:-false}
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
      YJS_AUTH_REQUIRED: "true"
      YJS_AUTH_TIMEOUT_MS: "3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1234/readyz >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ../..
      dockerfile: deploy/lan-external-storage/docker/frontend.Dockerfile
      args:
        BACKEND_UPSTREAM: backend:8080
        REALTIME_UPSTREAM: websocket:1234
        MINIO_INTERNAL_ORIGIN: ${MINIO_API:-http://100.81.241.98:9000}
        MINIO_CORS_ORIGIN: ${APP_FRONTEND_URL:-http://192.168.35.30}
        VITE_WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
    image: fileinnout/frontend:${APP_VERSION:-lan-prod}
    # Bind strictly to the home LAN IP (192.168.35.30) so external/Tailscale interfaces are not exposed
    ports:
      - "${LAN_HOST_IP:-192.168.35.30}:${APP_PORT:-80}:80"
      - "${LAN_HOST_IP:-192.168.35.30}:${MINIO_RELAY_PORT:-9000}:9000"
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
